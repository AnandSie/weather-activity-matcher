services:
  api:
    build:
      context: ./backend
      dockerfile: WeatherActivityMatcher.Api/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Data Source=/data/weather_matcher.db
    volumes:
      - sqlite-data:/data
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
    environment:
      - API_UPSTREAM=http://api:5000
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  sqlite-data:
